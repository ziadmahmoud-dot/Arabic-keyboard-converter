<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Arabic KeyFix</title>
  <style>
    body { width: 320px; font-family: sans-serif; background: #0f172a; color: #fff; padding: 14px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 10px 0; color: #10b981; }
    textarea { width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
    button { background: #10b981; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    button:hover { background: #059669; }
    .note { font-size: 11px; color: #94a3b8; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h2>Arabic Keyboard Converter</h2>
  <textarea id="src" rows="3" placeholder="Type here (e.g. lvpfh)..." autofocus></textarea>
  <textarea id="out" rows="3" placeholder="النتيجة بالعربي..." dir="rtl" readonly></textarea>
  <button id="copy">Copy Arabic Text</button>
  <div class="note">Press <b>Alt + A</b> anywhere in Chrome to convert!</div>

  <script src="converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
